name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Patch ZEGO Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZEGO_GRADLES < <(find "$HOME" -type f \( -name build.gradle -o -name build.gradle.kts \) -path '*zego_express_engine*/android/*' -print 2>/dev/null)
          echo "Found ${#ZEGO_GRADLES[@]} ZEGO Gradle file(s)"
          test "${#ZEGO_GRADLES[@]}" -gt 0
          for f in "${ZEGO_GRADLES[@]}"; do
            echo "Patching: $f"
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g; s/compileSdk[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk 36/g' "$f"
            grep -nE 'compileSdk' "$f" || true
          done

      - name: Analyze
        run: flutter analyze

      - name: Prepare permanent AVORA signing
        shell: bash
        env:
          AVORA_KEYSTORE_BASE64: ${{ secrets.AVORA_KEYSTORE_BASE64 }}
          AVORA_KEYSTORE_PASSWORD: ${{ secrets.AVORA_KEYSTORE_PASSWORD }}
          AVORA_KEY_PASSWORD: ${{ secrets.AVORA_KEY_PASSWORD }}
          AVORA_KEY_ALIAS: ${{ secrets.AVORA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$AVORA_KEYSTORE_BASE64"
          test -n "$AVORA_KEYSTORE_PASSWORD"
          test -n "$AVORA_KEY_PASSWORD"
          test -n "$AVORA_KEY_ALIAS"

          printf '%s' "$AVORA_KEYSTORE_BASE64" | base64 --decode > android/app/avora-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$AVORA_KEYSTORE_PASSWORD
          keyPassword=$AVORA_KEY_PASSWORD
          keyAlias=$AVORA_KEY_ALIAS
          storeFile=avora-upload-key.jks
          EOF

          keytool -list \
            -keystore android/app/avora-upload-key.jks \
            -storepass "$AVORA_KEYSTORE_PASSWORD" \
            -alias "$AVORA_KEY_ALIAS" >/dev/null

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVORA-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Cleanup signing files
        if: always()
        run: rm -f android/key.properties android/app/avora-upload-key.jks
