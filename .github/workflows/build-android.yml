name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify AVORA build inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.officialavora.app"' android/app/build.gradle.kts
          grep -q '"package_name": "com.officialavora.app"' android/app/google-services.json
          test -f lib/services/avora_google_sign_in_adapter.dart
          test -f lib/services/avora_firebase_auth_bridge.dart
          test -f lib/core/avora_account_linking.dart
          echo "AVORA identity and source files verified"

      - name: Patch ZEGO Android build
        shell: bash
        run: |
          set -euo pipefail
          ZEGO_DIR="$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 1 -type d -name 'zego_express_engine-*' -print -quit)"
          test -n "$ZEGO_DIR"

          ZEGO_GRADLE="$ZEGO_DIR/android/build.gradle"
          test -f "$ZEGO_GRADLE"

          echo "ZEGO_GRADLE=$ZEGO_GRADLE"

          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$ZEGO_GRADLE"

          grep -nE 'compileSdkVersion' "$ZEGO_GRADLE"
          grep -qE 'compileSdkVersion[[:space:]]+36' "$ZEGO_GRADLE"

      - name: Analyze
        run: flutter analyze

      - name: Test AVORA contracts
        run: flutter test

      - name: Set monotonic update version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((2000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "AVORA versionCode: $BUILD_NUMBER"

      - name: Prepare permanent AVORA signing
        shell: bash
        env:
          AVORA_KEYSTORE_BASE64: ${{ secrets.AVORA_KEYSTORE_BASE64 }}
          AVORA_KEYSTORE_PASSWORD: ${{ secrets.AVORA_KEYSTORE_PASSWORD }}
          AVORA_KEY_PASSWORD: ${{ secrets.AVORA_KEY_PASSWORD }}
          AVORA_KEY_ALIAS: ${{ secrets.AVORA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$AVORA_KEYSTORE_BASE64"
          test -n "$AVORA_KEYSTORE_PASSWORD"
          test -n "$AVORA_KEY_PASSWORD"
          test -n "$AVORA_KEY_ALIAS"
          printf '%s' "$AVORA_KEYSTORE_BASE64" | base64 --decode > android/app/avora-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$AVORA_KEYSTORE_PASSWORD
          keyPassword=$AVORA_KEY_PASSWORD
          keyAlias=$AVORA_KEY_ALIAS
          storeFile=avora-upload-key.jks
          EOF
          keytool -list \
            -keystore android/app/avora-upload-key.jks \
            -storepass "$AVORA_KEYSTORE_PASSWORD" \
            -alias "$AVORA_KEY_ALIAS" >/dev/null

      - name: Build universal release APK
        run: flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Build release AAB
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Verify update identity and artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/avora-signature.txt
          grep -qi 'certificate SHA-256 digest: c79aa1892a2c6b753049c814c55163a228475ba60431876ed97c776348b894ae' /tmp/avora-signature.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/avora-badging.txt
          grep -q "package: name='com.officialavora.app'" /tmp/avora-badging.txt
          grep -q "versionCode='$BUILD_NUMBER'" /tmp/avora-badging.txt
          unzip -t "$APK" >/dev/null

      - name: Publish latest AVORA update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk AVORA-latest.apk
          cp build/app/outputs/bundle/release/app-release.aab AVORA-latest.aab
          gh release delete avora-latest-update --cleanup-tag -y || true
          gh release create avora-latest-update AVORA-latest.apk AVORA-latest.aab \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AVORA Latest Update" \
            --notes "Signed update build from commit $GITHUB_SHA. Package com.officialavora.app. VersionCode $BUILD_NUMBER. Install over the existing AVORA app without uninstalling."

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AVORA-update-build
          path: |
            AVORA-latest.apk
            AVORA-latest.aab
          if-no-files-found: error

      - name: Cleanup signing files
        if: always()
        run: rm -f android/key.properties android/app/avora-upload-key.jks
